<!DOCTYPE html>
<html lang="da">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="Bock Amok">
		<meta name="theme-color" content="#050407">
		<link rel="apple-touch-icon" href="icon-180.png">
		<title>Bock Amok</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
html, body {
	width: 100%;
	height: 100%;
	background: #050407;
	overscroll-behavior: none;
}
body {
	color: #ead9a8;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	font-family: Georgia, "Times New Roman", serif;
}
#canvas {
	display: block;
	position: fixed;
	inset: 0;
	width: 100vw;
	height: 100vh;
	height: 100dvh;
}
#canvas:focus {
	outline: none;
}
#status {
	position: fixed;
	inset: 0;
	background: radial-gradient(ellipse at 50% 40%, #1a1420 0%, #050407 70%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 18px;
	visibility: hidden;
	text-align: center;
	padding: 0 24px;
}
#status-face {
	width: 132px;
	height: 132px;
	image-rendering: pixelated;
	border: 3px solid #8a6a3a;
	box-shadow: 0 0 40px rgba(255, 150, 60, 0.25);
}
#status-title {
	font-size: 44px;
	letter-spacing: 0.08em;
	font-variant: small-caps;
	color: #e6b84a;
	text-shadow: 0 2px 0 #000, 0 0 18px rgba(230, 120, 40, 0.35);
}
#status-bar {
	width: min(320px, 70vw);
	height: 10px;
	border: 2px solid #8a6a3a;
	background: #120c0a;
}
#status-fill {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, #7a1a0e, #d8901c);
	transition: width 0.15s;
}
#status-notice {
	display: none;
	max-width: 520px;
	color: #e05a4a;
	font-size: 16px;
}
#status-hint {
	font-size: 14px;
	color: #9a8a70;
	font-style: italic;
	max-width: 440px;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Din browser understøtter ikke WebGL2.
		</canvas>
		<noscript>
			JavaScript skal være slået til.
		</noscript>

		<div id="status">
			<img id="status-face" src="icon-180.png" alt="">
			<div id="status-title">Bock Amok</div>
			<div id="status-bar"><div id="status-fill"></div></div>
			<div id="status-notice"></div>
			<div id="status-hint"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":3478716,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusBar = document.getElementById('status-bar');
	const statusFill = document.getElementById('status-fill');
	const statusNotice = document.getElementById('status-notice');
	const statusHint = document.getElementById('status-hint');

	// iPhone i Safari: fuld skærm kræver "Føj til hjemmeskærm" (Safari har ingen Fullscreen API på iPhone)
	const isIOS = /iPhone|iPod/.test(navigator.userAgent);
	const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
	if (isIOS && !standalone) {
		statusHint.textContent = 'Tip: tryk på Del ⬆︎ → "Føj til hjemmeskærm" for at spille i fuld skærm. Hold telefonen på tværs.';
	} else {
		statusHint.textContent = 'Hold telefonen på tværs.';
	}

	let initializing = true;

	function hide() {
		statusOverlay.remove();
		initializing = false;
	}

	function fail(err) {
		console.error(err);
		statusBar.style.display = 'none';
		statusNotice.style.display = 'block';
		statusNotice.textContent = (err instanceof Error) ? err.message
			: (typeof err === 'string') ? err : 'Noget gik galt under indlæsningen.';
		initializing = false;
	}

	// Safari ruller/zoomer ellers på dobbelttryk og pinch selv med touch-action
	document.addEventListener('gesturestart', (e) => e.preventDefault());
	document.addEventListener('dblclick', (e) => e.preventDefault());

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	statusOverlay.style.visibility = 'visible';
	if (missing.length !== 0) {
		fail('Din browser mangler: ' + missing.join(', ') + '\nPrøv Safari, Chrome eller Firefox i nyeste version.');
		return;
	}
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				statusFill.style.width = Math.round(100 * current / total) + '%';
			}
		},
	}).then(hide, fail);
}());
		</script>
	</body>
</html>
