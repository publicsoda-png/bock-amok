@font-face {
	font-family: "Cloister Black";
	src: url("CloisterBlack.ttf") format("truetype");
	font-display: block;
}
:root {
	/* Natrium-paletten (client/walk/walk_theme.gd): violet nat, natriumgul, creme. Navnene er roller. */
	--charcoal: #1c1830;   /* NIGHT */
	--white: #ece6d6;      /* CREME */
	--sodium: #e8b040;     /* SODIUM */
	--sodium-lo: #a57b48;  /* SODIUM_LO */
	--wordmark: #f2f1ee;   /* SENSE ARCHIVES-wordmark: uændret */
}
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
html, body {
	width: 100%;
	height: 100%;
	background: var(--charcoal);
	overscroll-behavior: none;
}
body {
	color: var(--white);
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	font-family: "Departure Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
#canvas {
	display: block;
	position: fixed;
	inset: 0;
	width: 100vw;
	height: 100vh;
	height: 100dvh;
}
#canvas:focus {
	outline: none;
}
#status {
	position: fixed;
	inset: 0;
	background-color: var(--charcoal);
	background-image:
		repeating-linear-gradient(45deg, rgba(232,176,64,0.045) 0 1px, transparent 1px 44px),
		repeating-linear-gradient(-45deg, rgba(232,176,64,0.045) 0 1px, transparent 1px 44px);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 14px;
	visibility: hidden;
	text-align: center;
	padding: 0 16px;
}
#status-mascot {
	width: 150px;
	height: auto;
	animation: breathe 2.8s ease-in-out infinite;
	transform-origin: 50% 100%;
}
@keyframes breathe {
	50% { transform: scale(1.02, 0.98); }
}
#status-title {
	font-family: "Cloister Black", serif;
	font-size: clamp(44px, 9vw, 84px);
	line-height: 1;
	color: var(--wordmark);
}
#status-sub {
	font-size: 12px;
	font-weight: 600;
	letter-spacing: 0.12em;
	color: rgba(236, 230, 214, 0.6);
}
#status-bar {
	width: min(280px, 70vw);
	height: 2px;
	margin-top: 10px;
	background: rgba(236, 230, 214, 0.15);
}
#status-fill {
	height: 100%;
	width: 0%;
	background: var(--sodium);
	transition: width 0.15s;
}
#status-pct {
	font-size: 12px;
	font-weight: 600;
	letter-spacing: 0.08em;
	color: rgba(236, 230, 214, 0.6);
	font-variant-numeric: tabular-nums;
	min-height: 1em;
}
#status-notice {
	display: none;
	max-width: 520px;
	font-size: 15px;
	color: var(--white);
}
#status-hint {
	font-size: 13px;
	color: rgba(236, 230, 214, 0.5);
	max-width: 440px;
}
#status-links {
	display: none;
	gap: 10px;
	flex-wrap: wrap;
	justify-content: center;
}
#status-links a, noscript a {
	color: var(--charcoal);
	background: var(--sodium);
	padding: 10px 16px;
	font-weight: 600;
	font-size: 14px;
	text-decoration: none;
	border-radius: 2px;
}
/* "Tryk for at starte/fortsætte": loaderen bliver stående som tryk-lag (touch), efter at hovedpakken er klar */
#status.tap {
	cursor: pointer;
}
#status.tap #status-bar {
	display: none;
}
#status.tap #status-pct {
	font-size: 14px;
	letter-spacing: 0.16em;
	color: var(--sodium);
	animation: tap-pulse 1.6s ease-in-out infinite;
}
@keyframes tap-pulse {
	50% { opacity: 0.45; }
}
/* Telefon i portræt: vedvarende, blokerende (som RPG'ens "Drej telefonen på tværs") — forsvinder i landskab */
#rotate {
	position: fixed;
	inset: 0;
	z-index: 20;
	display: none;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 18px;
	background: var(--charcoal);
	text-align: center;
	padding: 0 16px;
}
#rotate.on {
	display: flex;
}
#rotate img {
	width: 110px;
	height: auto;
	animation: rotate-tilt 2.4s ease-in-out infinite;
}
@keyframes rotate-tilt {
	0%, 35% { transform: rotate(0deg); }
	55%, 90% { transform: rotate(-90deg); }
}
#rotate div {
	font-family: "Cloister Black", serif;
	font-size: clamp(32px, 9vw, 48px);
	line-height: 1.1;
	color: var(--wordmark);
}
/* Fælles fejl-lag: øverst, ét tryk genindlæser */
#sa-error {
	position: fixed;
	inset: 0;
	z-index: 30;
	display: none;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 12px;
	background: rgba(28, 24, 48, 0.94);
	text-align: center;
	padding: 0 16px;
	cursor: pointer;
}
#sa-error.on {
	display: flex;
}
#sa-error .t {
	font-family: "Cloister Black", serif;
	color: var(--wordmark);
	font-size: clamp(36px, 8vw, 64px);
	line-height: 1;
}
#sa-error .s {
	font-size: 14px;
	font-weight: 600;
	letter-spacing: 0.12em;
}
#sa-error .d {
	font-size: 11px;
	color: rgba(236, 230, 214, 0.4);
	max-width: 520px;
	overflow-wrap: anywhere;
}
/* Ekstra pakker (gaden/rpg): diskret bjælke nederst, når loaderen er væk; "Prøv igen" ved fejl */
#pack {
	position: fixed;
	left: 50%;
	bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
	transform: translateX(-50%);
	z-index: 10;
	display: none;
	flex-direction: column;
	align-items: center;
	gap: 6px;
	font-size: 11px;
	font-weight: 600;
	letter-spacing: 0.12em;
	color: rgba(236, 230, 214, 0.6);
	font-variant-numeric: tabular-nums;
	pointer-events: none;
	text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
}
#pack.on {
	display: flex;
}
#pack-bar {
	width: 140px;
	height: 2px;
	background: rgba(236, 230, 214, 0.15);
}
#pack-fill {
	height: 100%;
	width: 0%;
	background: var(--sodium);
	transition: width 0.2s;
}
#pack button {
	display: none;
	pointer-events: auto;
	font: inherit;
	font-size: 13px;
	color: var(--charcoal);
	background: var(--sodium);
	border: 0;
	border-radius: 2px;
	padding: 9px 16px;
	cursor: pointer;
}
#pack.err {
	color: var(--white);
	background: rgba(28, 24, 48, 0.88);
	border: 1px solid var(--sodium-lo);
	border-radius: 2px;
	padding: 10px 14px;
}
#pack.err #pack-bar {
	display: none;
}
#pack.err button {
	display: block;
}
/* Måler env(safe-area-inset-*) → window.saSafe (læses af Godot) */
#sa-safe {
	position: fixed;
	left: 0;
	top: 0;
	width: 0;
	height: 0;
	visibility: hidden;
	pointer-events: none;
	padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
noscript {
	position: fixed;
	inset: auto 0 24px 0;
	display: flex;
	gap: 10px;
	justify-content: center;
	flex-wrap: wrap;
	z-index: 2;
}

				s3tc = !!gl.getExtension('WEBGL_compressed_texture_s3tc');
				etc2 = !!gl.getExtension('WEBGL_compressed_texture_etc');
				const lose = gl.getExtension('WEBGL_lose_context');
				if (lose) lose.loseContext();
			}
		} catch (e) { /* vælg desktop-pakken */ }
		const mobile = /iPhone|iPad|iPod|Android/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
		const fmt = (forced && SA_PACKS[forced]) ? forced : ((etc2 && (mobile || !s3tc)) ? 'etc2' : 's3tc');
		const p = SA_PACKS[fmt];
		override.mainPack = p.file;
		override.fileSizes = Object.assign({}, GODOT_CONFIG.fileSizes, { [p.file]: p.size });
		console.log('SA pack: ' + fmt + ' (' + p.file + ', s3tc=' + s3tc + ', etc2=' + etc2 + ', mobil=' + mobile + ')');
		// Ekstra pakker (tools/packs/): fx world.pck med gaden. Hentes i baggrunden efter start og mountes af
		// shared/packs.gd (Packs.ensure), når spillet første gang skal bruge dem.
		window.SA_EXTRA = p.extra || null;
	}

	// --- Ekstra pakker. SA_PK[name] = { pct, buf, err } læses af shared/packs.gd. Ved netværksfejl prøves der
	// én gang automatisk; derefter vises "Prøv igen", og err forbliver tom, så spillet bliver ved med at vente
	// ("Henter gaden … %") i stedet for at fortsætte uden teksturer. done/fail er kun til shellen.
	const PACK_LABEL = { world: 'HENTER GADEN', rpg: 'INDSÆTTER MØNT' };
	const packEl = document.getElementById('pack');
	const packTxt = document.getElementById('pack-txt');
	const packFill = document.getElementById('pack-fill');
	let packTimer = 0;
	function packUI() {
		let active = null, failed = null;
		for (const n in window.SA_PK) {
			const st = window.SA_PK[n];
			if (st.fail) failed = failed || n;
			else if (!st.done) active = active || n;
		}
		packEl.classList.toggle('err', !!failed);
		if (failed) {
			packEl.classList.add('on');
			packTxt.textContent = (failed === 'world' ? 'GADEN' : failed.toUpperCase()) + ' KUNNE IKKE HENTES';
		} else if (active) {
			const pct = window.SA_PK[active].pct || 0;
			packEl.classList.add('on');
			packTxt.textContent = (PACK_LABEL[active] || 'HENTER') + ' ' + pct + ' %';
			packFill.style.width = pct + '%';
		} else {
			packEl.classList.remove('on');
		}
		if (!active && !failed) { clearInterval(packTimer); packTimer = 0; }
	}
	function packWatch() {
		if (!packTimer) packTimer = setInterval(packUI, 200);
		packUI();
	}
	function packRun(name, st, tries) {
		const e = window.SA_EXTRA[name];
		st.fail = null; st.pct = 0;
		fetch(e.file, { cache: tries > 0 ? 'reload' : 'default' }).then(async (r) => {
			if (!r.ok || !r.body) throw new Error('HTTP ' + r.status);
			const out = new Uint8Array(e.size);
			const rd = r.body.getReader();
			let got = 0;
			for (;;) {
				const { done, value } = await rd.read();
				if (done) break;
				if (got + value.length > out.length) throw new Error('større end manifestet');
				out.set(value, got);
				got += value.length;
				st.pct = Math.floor(100 * got / e.size);
			}
			if (got !== e.size) throw new Error('fik ' + got + ' af ' + e.size + ' bytes');
			st.buf = out.buffer;
			st.done = true;
			console.log('SA extra pack klar: ' + name + ' (' + got + ' bytes)');
		}).catch((err) => {
			console.warn('SA extra pack fejl: ' + name + ' (forsøg ' + (tries + 1) + ')', String(err));
			if (tries < 1) setTimeout(() => packRun(name, st, tries + 1), 1500);
			else st.fail = String(err);
		});
		packWatch();
	}
	window.SA_PK = {};
	window.saFetchPack = function (name) {
		const e = window.SA_EXTRA && window.SA_EXTRA[name];
		if (!e || window.SA_PK[name]) return;
		packRun(name, window.SA_PK[name] = { pct: 0, buf: null, err: null, done: false, fail: null }, 0);
	};
	document.getElementById('pack-retry').addEventListener('click', (ev) => {
		ev.stopPropagation();
		for (const n in window.SA_PK) {
			const st = window.SA_PK[n];
			if (st.fail) { console.log('SA extra pack prøv igen: ' + n); packRun(n, st, 0); }
		}
	});

	engine.startGame({
		'mainPack': override.mainPack,
		'fileSizes': override.fileSizes,
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				const pct = Math.min(100, Math.round(100 * current / total));
				statusFill.style.width = pct + '%';
				statusPct.textContent = pct < 100 ? pct + ' %' : 'Starter …';
			}
		},
		// wasm-abort/OOM kommer som printErr ("Aborted(...)", "Cannot enlarge memory"); alt andet logges som før
		'onPrintError': function () {
			const args = Array.from(arguments);
			console.error.apply(console, args);
			window.saFatalPrint(args.join(' '));
		},
		'onExit': function (code) {
			if (code !== 0) window.saShowError('Spillet stoppede (kode ' + code + ')');
		},
	}).then(() => {
		hide();
		// gaden hentes mens man står i kiosken (efter hovedpakken, så de ikke deler båndbredden)
		if (window.SA_EXTRA) for (const name in window.SA_EXTRA) if (!window.SA_EXTRA[name].lazy) window.saFetchPack(name);
	}, fail);
}());
		</script>
	</body>
</html>
